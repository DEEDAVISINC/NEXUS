# NEXUS frontend (CRA) — site: nexus-command → nexus.deedavis.biz ONLY.
# Cause We Care (cwecare.org) uses a SEPARATE Netlify site — see netlify.cwc.toml and CWC_DEPLOY.md.
# Do NOT add cwecare.org as a domain alias here; Netlify redirects aliases to the primary domain.

[build]
  base = "nexus-frontend"
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "18"
  CI = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  # PythonAnywhere Backend
  REACT_APP_API_BASE = "https://deedavis.pythonanywhere.com"

[context.deploy-preview.environment]
  # PythonAnywhere Backend
  REACT_APP_API_BASE = "https://deedavis.pythonanywhere.com"

[context.branch-deploy.environment]
  # PythonAnywhere Backend
  REACT_APP_API_BASE = "https://deedavis.pythonanywhere.com"
