# NEXUS frontend (CRA). Same build can serve:
#   - nexus.deedavis.biz (or your ops hostname)
#   - cwecare.org + www.cwecare.org (Netlify: Domain settings → Add custom domain → point DNS per Netlify panel)
# App.tsx routes CWCSite when Host is cwecare.org / www / app.cwecare.org OR path starts with /cwc

[build]
  base = "nexus-frontend"
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "18"
  CI = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  # PythonAnywhere Backend
  REACT_APP_API_BASE = "https://deedavis.pythonanywhere.com"

[context.deploy-preview.environment]
  # PythonAnywhere Backend
  REACT_APP_API_BASE = "https://deedavis.pythonanywhere.com"

[context.branch-deploy.environment]
  # PythonAnywhere Backend
  REACT_APP_API_BASE = "https://deedavis.pythonanywhere.com"
