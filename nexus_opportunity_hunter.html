<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS Opportunity Hunter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #1a1a1a;
            line-height: 1.6;
        }
        
        .header {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .search-panel {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
        }
        
        .search-panel h2 {
            color: #1e3a8a;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        
        .form-group select,
        .form-group input {
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        
        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        
        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.75rem;
            margin-top: 0.5rem;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #3b82f6;
        }
        
        .hunt-button {
            background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
            color: white;
            border: none;
            padding: 1rem 3rem;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            display: block;
            margin: 2rem auto 0;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .hunt-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(220, 38, 38, 0.3);
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .results-header h2 {
            color: #1e3a8a;
            font-size: 1.5rem;
        }
        
        .results-count {
            background: #3b82f6;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
        }
        
        .agency-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 1.5rem;
        }
        
        .agency-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            border-left: 6px solid #e5e7eb;
        }
        
        .agency-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        }
        
        .agency-card.excellent {
            border-left-color: #dc2626;
        }
        
        .agency-card.good {
            border-left-color: #f59e0b;
        }
        
        .agency-card.moderate {
            border-left-color: #3b82f6;
        }
        
        .card-header {
            padding: 1.5rem;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-bottom: 1px solid #e5e7eb;
        }
        
        .card-title {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }
        
        .agency-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e293b;
            line-height: 1.3;
        }
        
        .match-score {
            text-align: center;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
        }
        
        .match-score.excellent {
            background: #fef2f2;
            color: #dc2626;
        }
        
        .match-score.good {
            background: #fffbeb;
            color: #d97706;
        }
        
        .match-score.moderate {
            background: #eff6ff;
            color: #2563eb;
        }
        
        .match-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }
        
        .card-body {
            padding: 1.5rem;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #f1f5f9;
        }
        
        .stat-row:last-of-type {
            border-bottom: none;
            margin-bottom: 0;
        }
        
        .stat-label {
            color: #6b7280;
            font-size: 0.9rem;
        }
        
        .stat-value {
            font-weight: 700;
            color: #1e293b;
        }
        
        .spending-amount {
            color: #059669;
            font-size: 1.1rem;
        }
        
        .setaside-badge {
            background: #dbeafe;
            color: #1e40af;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .active-opps {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 2px solid #f1f5f9;
        }
        
        .active-opps h4 {
            color: #1e3a8a;
            font-size: 0.95rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .opp-item {
            background: #f8fafc;
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            border-left: 3px solid #3b82f6;
        }
        
        .opp-title {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.25rem;
        }
        
        .opp-meta {
            color: #6b7280;
            font-size: 0.85rem;
        }
        
        .opp-due {
            color: #dc2626;
            font-weight: 600;
        }
        
        .card-actions {
            padding: 1rem 1.5rem;
            background: #f8fafc;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 0.75rem;
        }
        
        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            flex: 1;
            text-align: center;
        }
        
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        
        .btn-primary:hover {
            background: #2563eb;
        }
        
        .btn-secondary {
            background: white;
            color: #3b82f6;
            border: 2px solid #3b82f6;
        }
        
        .btn-secondary:hover {
            background: #eff6ff;
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            color: #6b7280;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .no-results {
            text-align: center;
            padding: 3rem;
            color: #6b7280;
        }
        
        .no-results-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔍 NEXUS Opportunity Hunter</h1>
        <p>Discover federal agencies awarding contracts to businesses like yours</p>
    </div>
    
    <div class="container">
        <div class="search-panel">
            <h2>Search Criteria</h2>
            <p style="color: #6b7280; margin-bottom: 1rem;">Pre-populated with DDI's profile. Modify as needed.</p>
            
            <div class="form-grid">
                <div class="form-group">
                    <label>Certifications (DDI Status)</label>
                    <div class="checkbox-grid">
                        <div class="checkbox-item">
                            <input type="checkbox" id="edwosb" checked>
                            <label for="edwosb">EDWOSB</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="wosb" checked>
                            <label for="wosb">WOSB</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="wbe" checked>
                            <label for="wbe">WBE</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="mbe" checked>
                            <label for="mbe">MBE</label>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>NAICS Codes (Core Services)</label>
                    <div class="checkbox-grid">
                        <div class="checkbox-item">
                            <input type="checkbox" id="naics-621511" checked>
                            <label for="naics-621511">621511 - Medical Labs/Drug Testing</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="naics-561730" checked>
                            <label for="naics-561730">561730 - Landscaping/Grounds</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="naics-561611" checked>
                            <label for="naics-561611">561611 - Investigation/Fingerprinting</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="naics-492110" checked>
                            <label for="naics-492110">492110 - Courier/Delivery</label>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Geographic Focus</label>
                    <select id="location">
                        <option value="nationwide" selected>Nationwide (DDI serves all 50 states)</option>
                        <option value="michigan">Michigan (Home State)</option>
                        <option value="midwest">Midwest Region</option>
                        <option value="southeast">Southeast Region</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Contract Value Range</label>
                    <select id="value-range">
                        <option value="all" selected>All Values</option>
                        <option value="micro">Micro ($10K-$50K)</option>
                        <option value="small">Small ($50K-$250K)</option>
                        <option value="medium">Medium ($250K-$1M)</option>
                        <option value="large">Large ($1M-$5M)</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group" style="margin-top: 1rem;">
                <label>Specific Agency (Optional)</label>
                <input type="text" id="specific-agency" placeholder="e.g., Veterans Health Administration, USACE, CBP...">
            </div>
            
            <button class="hunt-button" onclick="huntOpportunities()">
                🔴 HUNT OPPORTUNITIES
            </button>
        </div>
        
        <div id="results-section" style="display: none;">
            <div class="results-header">
                <h2>Agency Scorecards</h2>
                <span class="results-count" id="results-count">0 agencies found</span>
            </div>
            
            <div id="agency-grid" class="agency-grid">
                <!-- Results populated by JavaScript -->
            </div>
        </div>
        
        <div id="loading-section" class="loading" style="display: none;">
            <div class="loading-spinner"></div>
            <p>Scanning SAM.gov & USASpending...</p>
            <p style="font-size: 0.9rem; margin-top: 0.5rem;">Analyzing $700B+ in federal spending</p>
        </div>
    </div>
    
    <script>
        // DDI Profile Data
        const ddiProfile = {
            certifications: ['EDWOSB', 'WOSB', 'WBE', 'MBE', 'SBE', 'E-Verify'],
            naicsCodes: ['621511', '561730', '561611', '492110', '561210', '561720'],
            services: ['Drug Testing/TPA', 'Fingerprinting/Credentialing', 'Medical Courier', 'NEMT', 'Grounds/Facilities'],

        // Sample agency data (would come from API in production)
        const sampleAgencies = [
            {

                    {

                    }
                ],
                keyContacts: [
                    { name: "Eileen Meyer", email: "eileen.meyer@va.gov" },
                    { name: "Monique Euter", email: "monique.euter@va.gov" }
                ],
                whyMatch: [
                    "$890M annual drug testing spend - DDI has eScreen/Quest network",
                    "41% EDWOSB set-asides - DDI certification advantage",
                    "VISN 10 (Detroit) home territory - local presence",
                    "Active solicitations match DDI core services"
                ]
            },
            {
                name: "US Army Corps of Engineers",
                matchScore: 88,
                tier: "excellent",
                annualSpending: {
                    "561730": 120000000,
                    "561720": 85000000,
                    "237310": 450000000
                },
                totalSpending: 655000000,
                setAsidePercentage: 35,
                location: "Great Lakes Region",
                activeOpportunities: [
                    {
                        title: "Grounds Maintenance - Buckhorn Lake",
                        solicitation: "W912DR25XXXX",
                        location: "Buckhorn Lake, KY",
                        dueDate: "2026-03-30",
                        score: 85,
                        type: "service"
                    },
                    {
                        title: "Janitorial Services - Detroit District",
                        solicitation: "W912DR26XXXX",
                        location: "Detroit, MI",
                        dueDate: "2026-04-15",
                        score: 91,
                        type: "service"
                    }
                ],
                keyContacts: [
                    { name: "Contracting Office", email: "detroit.ces contracting@usace.army.mil" }
                ],
                whyMatch: [
                    "Great Lakes Region - DDI home territory advantage",
                    "Active RFPs for grounds/janitorial - DDI service lanes",
                    "35% SB set-asides - competitive advantage",
                    "$655M regional spending - significant opportunity"
                ]
            },
            {
                name: "CBP - Customs & Border Protection",
                matchScore: 85,
                tier: "excellent",
                annualSpending: {
                    "621511": 2400000000,
                    "621999": 180000000
                },
                totalSpending: 2580000000,
                setAsidePercentage: 28,
                location: "Nationwide (328 ports)",
                activeOpportunities: [
                    {
                        title: "Medical Screening & Drug Testing",
                        solicitation: "70B06C26R00000017",
                        location: "Nationwide",
                        dueDate: "2026-04-10",
                        score: 95,
                        type: "service"
                    }
                ],
                keyContacts: [
                    { name: "Procurement Office", email: "cbp.procurement@dhs.gov" }
                ],
                whyMatch: [
                    "$2.4B annual drug testing - largest single opportunity",
                    "60K+ employees need testing - massive volume",
                    "eScreen covers all 328 ports - 100% coverage",

                ]
            },
            {
                name: "Michigan DTMB",
                matchScore: 87,
                tier: "excellent",
                annualSpending: {
                    "621511": 5000000
                },
                totalSpending: 15000000,
                setAsidePercentage: 15,
                location: "Michigan (Statewide)",
                activeOpportunities: [
                    {
                        title: "Statewide Drug Testing TPA",
                        solicitation: "RFP-171 (Expected)",
                        location: "Michigan (83 counties)",
                        dueDate: "TBD 2026",
                        score: 95,
                        type: "service"
                    }
                ],
                keyContacts: [
                    { name: "State Procurement", email: "procurement@michigan.gov" }
                ],
                whyMatch: [
                    "Home state advantage - Troy HQ, local relationships",
                    "Statewide eScreen network covers all 83 counties",
                    "RFP-171 coming 2026 - DDI positioned",
                    "SBE certified - Michigan preference points"
                ]
            }
        ];
        
        function huntOpportunities() {
            // Show loading
            document.getElementById('loading-section').style.display = 'block';
            document.getElementById('results-section').style.display = 'none';
            
            // Simulate API call
            setTimeout(() => {
                document.getElementById('loading-section').style.display = 'none';
                document.getElementById('results-section').style.display = 'block';
                renderResults(sampleAgencies);
            }, 2000);
        }
        
        function renderResults(agencies) {
            const grid = document.getElementById('agency-grid');
            const count = document.getElementById('results-count');
            
            count.textContent = `${agencies.length} agencies found`;
            
            grid.innerHTML = agencies.map(agency => `
                <div class="agency-card ${agency.tier}">
                    <div class="card-header">
                        <div class="card-title">
                            <div class="agency-name">${agency.name}</div>
                            <div class="match-score ${agency.tier}">
                                <div class="match-label">Match Score</div>
                                ${agency.matchScore}/100
                            </div>
                        </div>
                    </div>
                    
                    <div class="card-body">
                        <div class="stat-row">
                            <span class="stat-label">Annual NAICS Spending</span>
                            <span class="stat-value spending-amount">$${(agency.totalSpending / 1000000).toFixed(0)}M</span>
                        </div>
                        
                        <div class="stat-row">
                            <span class="stat-label">EDWOSB Set-Asides</span>
                            <span class="setaside-badge">${agency.setAsidePercentage}%</span>
                        </div>
                        
                        <div class="stat-row">
                            <span class="stat-label">Geographic Coverage</span>
                            <span class="stat-value">${agency.location}</span>
                        </div>
                        
                        ${agency.activeOpportunities.length > 0 ? `
                        <div class="active-opps">
                            <h4>📋 Active Opportunities (${agency.activeOpportunities.length})</h4>
                            ${agency.activeOpportunities.map(opp => `
                                <div class="opp-item">
                                    <div class="opp-title">${opp.title}</div>
                                    <div class="opp-meta">
                                        ${opp.solicitation} • ${opp.location}<br>
                                        Due: <span class="opp-due">${opp.dueDate}</span> • Score: ${opp.score}/100
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        ` : ''}
                    </div>
                    
                    <div class="card-actions">
                        <button class="btn btn-primary" onclick="viewScorecard('${agency.name}')">
                            View Scorecard
                        </button>
                        <button class="btn btn-secondary" onclick="generateCapStatement('${agency.name}')">
                            Generate Cap Statement
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        function viewScorecard(agencyName) {
            alert(`Full scorecard for ${agencyName} would open here.\n\nIncludes:\n- Detailed spending breakdown by NAICS\n- Historical contract awards\n- Incumbent analysis\n- Key contact details\n- Recommended approach strategy`);
        }
        
        function generateCapStatement(agencyName) {
            alert(`Capability statement generation for ${agencyName}:\n\n- Auto-extracts DDI logo\n- Applies ${agencyName}-specific language\n- Uses sector-appropriate colors\n- Includes relevant past performance\n\nOutput: HTML + PDF in SEND_TO_BUYER/`);
        }
        
        // Auto-hunt on page load (optional)
        // window.onload = huntOpportunities;
    </script>
</body>
</html>
